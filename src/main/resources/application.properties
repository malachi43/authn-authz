spring.application.name=demo
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE}
spring.security.oauth2.client.registration.provider.google.authorization-uri=${GOOGLE_AUTHORIZATION_URI}
spring.security.oauth2.client.registration.provider.google.token-uri=${GOOGLE_TOKEN_URI}
spring.security.oauth2.client.registration.provider.google.user-info-uri=${GOOGLE_USER_INFO_URI}
